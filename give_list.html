<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Розыгрыши</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* страница розыгрышей (мини-приложение, 02.11.2026): шанс, таймер, билет одной кнопкой; цвета — из темы Telegram */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a7fd4);
    --btn: var(--tg-theme-button-color, #2a7fd4);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --bad: var(--tg-theme-destructive-text-color, #d64545);
    --good: #2fa36b;
    --gold: #d9a520;
    --line: rgba(138, 143, 152, .3);
    --chip: rgba(42, 127, 212, .12);
    --soft: rgba(138, 143, 152, .12);
  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root { --line: color-mix(in srgb, var(--hint) 28%, transparent); --chip: color-mix(in srgb, var(--btn) 12%, transparent);
      --soft: color-mix(in srgb, var(--hint) 12%, transparent); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 12px 96px; }
  h1 { font-size: 20px; margin: 6px 4px 2px; }
  .sub { color: var(--hint); margin: 0 4px 12px; font-size: 13px; }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin: 0 0 12px; }
  .seg button { flex: 1; border: 0; border-radius: 9px; padding: 8px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  .seg button.on { background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .give { background: var(--card); border-radius: 16px; padding: 12px; margin: 0 0 10px; }
  .top { display: flex; gap: 12px; }
  .pic { width: 76px; height: 76px; border-radius: 12px; overflow: hidden; flex: none; background: var(--soft);
    display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .head { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 16px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .chat { color: var(--link); font-size: 13px; text-decoration: none; cursor: pointer; }
  .meta { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .chip { border-radius: 999px; padding: 4px 10px; font-size: 13px; background: var(--soft); white-space: nowrap; }
  .chip.in { background: rgba(47, 163, 107, .15); color: var(--good); font-weight: 600; }
  .chip.time { font-variant-numeric: tabular-nums; }
  .chip.win { background: rgba(217, 165, 32, .18); color: var(--gold); font-weight: 600; }
  .bar { height: 6px; border-radius: 6px; background: var(--soft); margin: 8px 0 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--btn); border-radius: 6px; }
  .chance { display: flex; align-items: center; gap: 12px; margin: 10px 0 0; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); }
  .pct { font-size: 24px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 84px; }
  .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); }
  .lbl small { display: block; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); margin-top: 2px; }
  .cond { color: var(--hint); font-size: 13px; margin: 8px 0 0; }
  .need { margin: 8px 0 0; font-size: 13px; }
  .need .links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
  .act { display: flex; gap: 8px; margin: 10px 0 0; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 11px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--btn); color: var(--btn-text); }
  .btn.ghost { flex: none; background: var(--chip); color: var(--text); font-weight: 500; }
  .btn.done { background: rgba(47, 163, 107, .15); color: var(--good); cursor: default; }
  .btn[disabled] { opacity: .6; }
  .small { border: 0; border-radius: 10px; padding: 7px 11px; background: var(--chip); color: var(--text); font: inherit;
    font-size: 13px; cursor: pointer; }
  .empty { text-align: center; color: var(--hint); padding: 28px 16px; background: var(--card); border-radius: 16px; }
  .empty .btn { margin-top: 12px; max-width: 260px; }
  #new { display: none; width: 100%; margin-top: 4px; }
  .wall { text-align: center; padding: 40px 16px; color: var(--hint); }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 14px; max-width: 536px; margin: 0 auto; padding: 11px 14px;
    border-radius: 12px; background: rgba(20, 22, 28, .92); color: #fff; font-size: 14px; opacity: 0; transform: translateY(8px);
    transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="wall" class="wall" hidden></div>
  <div id="page" hidden>
    <h1>🎁 Розыгрыши</h1>
    <p class="sub">Билет бесплатный, один на человека. Победителей выбирает публичное случайное число drand — заранее его не знает никто, даже Кель.</p>
    <div class="seg"><button id="tabAll" class="on">Идут сейчас</button><button id="tabMine">Мои</button></div>
    <div id="list"></div>
    <button class="btn" id="new">➕ Свой розыгрыш</button>
  </div>
</main>
<div id="toast"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = (tg && tg.initData) || "";
  var $ = function (id) { return document.getElementById(id); };
  var S = { items: [], tab: "all", skew: 0, form: false, need: {}, busy: {} };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function wall(text) { $("page").hidden = true; $("wall").hidden = false; $("wall").textContent = text; }
  function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) { /* не в Telegram */ } }
  var toastT;
  function toast(text) { var t = $("toast"); t.textContent = text; t.className = "show"; clearTimeout(toastT); toastT = setTimeout(function () { t.className = ""; }, 3500); }
  function openTg(url) { try { tg.openTelegramLink(url); } catch (e) { window.open(url, "_blank"); } }
  function openUrl(url) { try { tg.openLink(url); } catch (e) { window.open(url, "_blank"); } }

  function api(act, extra) {
    var body = { initData: initData }; for (var k in extra || {}) body[k] = extra[k];
    return fetch("/give/app/" + act, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Сервер ответил странно — попробуй ещё раз." }; }); })
      .catch(function () { return { ok: false, error: "Нет связи — проверь интернет." }; });
  }

  function plural(n, one, few, many) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function left(sec) {
    sec = Math.max(0, Math.floor(sec));
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return d ? d + "д " + pad(h) + ":" + pad(m) : pad(h) + ":" + pad(m) + ":" + pad(s);
  }
  function pct(p) {
    var x = p * 100;
    if (x >= 99.95) return "100%";
    var t = x < 1 ? x.toFixed(2) : x < 10 ? x.toFixed(1) : x.toFixed(0);
    return "≈" + t.replace(/\.?0+$/, "") + "%";
  }
  function now() { return (Date.now() + S.skew) / 1000; }

  function card(it) {
    var a = el("article", "give"); a.dataset.id = it.id;
    var top = el("div", "top"), pic = el("div", "pic");
    if (it.img) { var im = el("img"); im.alt = ""; im.loading = "lazy"; im.src = it.img; im.onerror = function () { pic.textContent = "🎁"; }; pic.appendChild(im); }
    else pic.textContent = "🎁";
    var head = el("div", "head");
    head.appendChild(el("div", "title", it.prize));
    var ch = el("a", "chat", it.chat); if (it.chat_url) ch.onclick = function () { openTg(it.chat_url); }; head.appendChild(ch);
    head.appendChild(el("div", "meta", "🏆 " + it.k + " " + plural(it.k, "победитель", "победителя", "победителей") +
      " · 👥 " + it.n + " " + plural(it.n, "участник", "участника", "участников")));
    top.appendChild(pic); top.appendChild(head); a.appendChild(top);

    var chips = el("div", "chips"), open = it.state === "open" && it.end > now();
    if (it.state === "done") chips.appendChild(it.won ? el("span", "chip win", "🎉 ты выиграл!") : el("span", "chip", it.mine ? "итоги подведены — в этот раз не повезло" : "итоги подведены"));
    else if (it.mine) chips.appendChild(el("span", "chip in", "● ты участвуешь"));
    if (it.own) chips.appendChild(el("span", "chip", "твой розыгрыш" + (it.pub ? " · 🌍 публичный" : " · 🔒 частный")));
    if (open) {
      var tm = el("span", "chip time"); tm.dataset.end = it.end; chips.appendChild(tm);
    } else if (it.state === "open" || it.state === "closing" || it.state === "closed") chips.appendChild(el("span", "chip", "⏳ подвожу итоги"));
    a.appendChild(chips);
    if (it.goal && it.state === "open") {
      var bar = el("div", "bar"), fill = el("i"); fill.style.width = Math.min(100, it.n / it.goal * 100) + "%"; bar.appendChild(fill); a.appendChild(bar);
    }
    if (it.state !== "done") {
      var c = el("div", "chance"), lbl = el("div", "lbl", it.mine ? "твой шанс выиграть" : "шанс, если войдёшь");
      c.appendChild(el("div", "pct", pct(it.chance)));
      lbl.appendChild(el("small", "", it.mine ? "Билет №" + it.mine[0] + " · код " + it.mine[1] : "Один бесплатный билет — одной кнопкой"));
      c.appendChild(lbl); a.appendChild(c);
    }
    a.appendChild(el("div", "cond", "✅ Условие: " + (it.subs.length ? "подписка на " + it.subs.join(", ") : "нет — участвуют все")));
    var need = S.need[it.id];
    if (need && open && !it.mine) {
      var nb = el("div", "need"); nb.appendChild(el("div", "", need.error));
      var links = el("div", "links");
      (need.need || []).forEach(function (x) { var b = el("button", "small", (x.group ? "Вступить: " : "Подписаться: ") + x.name); b.onclick = function () { openTg(x.url); }; links.appendChild(b); });
      nb.appendChild(links); a.appendChild(nb);
    }
    var act = el("div", "act");
    if (open && !it.mine) {
      var go = el("button", "btn", need ? "🔄 Проверить и участвовать" : "🎟 Участвовать"); go.disabled = !!S.busy[it.id];
      go.onclick = function () { join(it.id); }; act.appendChild(go);
    } else if (it.mine && it.state !== "done") act.appendChild(el("button", "btn done", "✅ Ты в деле"));
    var v = el("button", "btn ghost", it.state === "done" ? "🏆 Итоги" : "🔍 Проверка"); v.onclick = function () { openUrl(it.verify); };
    if (!act.children.length) v.style.flex = "1";
    act.appendChild(v); a.appendChild(act);
    return a;
  }

  function render() {
    var all = S.items.filter(function (x) { return x.listed; });
    var mine = S.items.filter(function (x) { return x.mine || x.own; });
    $("tabAll").textContent = "Идут сейчас" + (all.length ? " · " + all.length : "");
    $("tabMine").textContent = "Мои" + (mine.length ? " · " + mine.length : "");
    $("tabAll").className = S.tab === "all" ? "on" : ""; $("tabMine").className = S.tab === "mine" ? "on" : "";
    var box = $("list"), show = S.tab === "all" ? all : mine; box.textContent = "";
    if (!show.length) {
      var e = el("div", "empty", S.tab === "all" ? "Сейчас нет публичных розыгрышей. Запусти свой — это бесплатно и честно."
        : "Ты пока нигде не участвуешь. Загляни во вкладку «Идут сейчас».");
      box.appendChild(e);
    } else show.forEach(function (it) { box.appendChild(card(it)); });
    tick();
  }

  function tick() {
    var t = now();
    [].forEach.call(document.querySelectorAll(".chip.time"), function (c) {
      var it = S.items.filter(function (x) { return String(x.id) === c.parentNode.parentNode.dataset.id; })[0];
      var sec = +c.dataset.end - t;
      if (sec <= 0) { c.textContent = "⏳ подвожу итоги"; return; }
      c.textContent = it && it.goal ? "👥 " + it.n + " из " + it.goal + " · не позже чем через " + left(sec) : "⏳ " + left(sec);
    });
  }

  function load(quiet) {
    return api("list").then(function (r) {
      if (!r.ok) { if (!quiet) wall(r.error || "Не получилось открыть — попробуй ещё раз из бота."); return; }
      S.skew = r.now * 1000 - Date.now(); S.items = r.items || []; S.form = !!r.form;
      if (!quiet && !S.items.some(function (x) { return x.listed; }) && S.items.length) S.tab = "mine";
      $("page").hidden = false; $("wall").hidden = true;
      if (S.form) {
        try { tg.MainButton.setParams({ text: "➕ Свой розыгрыш", is_visible: true, is_active: true }); }
        catch (e) { $("new").style.display = "block"; }
        if (!(tg && tg.MainButton && tg.MainButton.setParams)) $("new").style.display = "block";
      }
      render();
    });
  }

  function join(gid) {
    S.busy[gid] = true; render();
    api("join", { gid: gid }).then(function (r) {
      S.busy[gid] = false;
      if (r.ok && r.item) {
        delete S.need[gid];
        S.items = S.items.map(function (x) { return x.id === gid ? Object.assign({}, r.item, { listed: x.listed }) : x; });
        haptic("success"); toast("🎟 Ты в деле! Билет №" + r.item.mine[0] + " — Кель прислала его и в личку.");
      } else if (r.need || /подпис/i.test(r.error || "")) {
        S.need[gid] = r; haptic("warning");
      } else { haptic("error"); toast(r.error || "Не получилось — попробуй ещё раз."); }
      render();
    });
  }

  function newGive() { location.href = "/give/app"; }

  if (!initData) { wall("Эту страницу открывают из Telegram: напиши Кель /gives и нажми «📱 Открыть розыгрыши»."); return; }
  try { tg.ready(); tg.expand(); tg.MainButton.onClick(newGive); } catch (e) { /* без Telegram */ }
  $("tabAll").onclick = function () { S.tab = "all"; render(); };
  $("tabMine").onclick = function () { S.tab = "mine"; render(); };
  $("new").onclick = newGive;
  load(false);
  setInterval(tick, 1000);
  setInterval(function () { if (!document.hidden) load(true); }, 30000);
})();
</script>
</body>
</html>
